# dsh-mcp-ctl bundle patch — mounts the plugin into a profile layer stack.
#
# This file is the `dsh.bundle.patch` layer of the published npm package. When
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-mcp-ctl
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-mcp-ctl` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like the manual cordis.patch.yml mount line used before. No profile
# file edits needed — one command installs and mounts.
#
# If the profile still carries the old manual mount line in its own
# cordis.patch.yml, remove it before switching to the bundle channel: both
# layers would insert the same row id `mcp-ctl`, mounting the host half twice
# (two `/mcp` command registrations, two client cards).
#
# The host half registers the `/mcp` command and the toggle logic; the Web
# client card is served by the profile's client-modules route once this entry
# is live. The row id stays `mcp-ctl` so a config block written against the
# manual mount line keeps working unchanged.
- insert:
    - id: mcp-ctl
      name: 'dsh-mcp-ctl'
